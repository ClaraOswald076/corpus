[project]
name = "multi-agent-platform"
version = "0.1.0"
description = "多智能体层级平台 - Hierarchical Multi-Agent Platform"
requires-python = ">=3.12"

[tool.poetry.dependencies]
python = "^3.12"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
aiosqlite = "^0.20.0"
# asyncpg = "^0.29.0"  # PostgreSQL only, Linux production
alembic = "^1.13.0"
litellm = "^1.40.0"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
typer = "^0.12.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
cryptography = "^42.0.0"
pyyaml = "^6.0.0"
httpx = "^0.27.0"
python-multipart = "^0.0.9"
websockets = "^12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
ruff = "^0.4.0"

[tool.poetry.scripts]
ma = "src.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
